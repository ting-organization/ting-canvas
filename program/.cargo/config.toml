[build]
target = "wasm32v1-none"

[target.wasm32v1-none]
rustflags = [
  # Bulk copies and sign extension are in Ting's profile; nothing else of WebAssembly 2.0 is.
  "-C", "target-feature=+bulk-memory,+sign-ext",
  # One page to start, which each invocation pays for, and a 16 KiB stack inside it.
  "-C", "link-arg=--initial-memory=65536",
  "-C", "link-arg=--max-memory=16777216",
  "-C", "link-arg=-zstack-size=16384",
]
