<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ting Canvas</title>
  <meta name="description" content="One canvas a week on the Ting chain. Painting burns coins; when the week ends the canvas locks for good and is auctioned.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img src="icon.svg" alt="" width="28" height="28"><span>Ting Canvas</span></a>
    <nav>
      <a href="#/" data-nav="paint">Paint</a>
      <a href="#/gallery" data-nav="gallery">Gallery</a>
      <a href="#/about" data-nav="about"><span class="long">How it works</span><span class="short">About</span></a>
    </nav>
    <span class="network" id="network"></span>
    <button class="sign-chip" id="sign-chip">Ting ID</button>
  </header>
  <main id="view"><section class="notice"><p class="muted">Reading the chain…</p></section></main>
  <dialog id="sign-dialog" aria-label="Signing">
    <button class="close" aria-label="Close">×</button>
    <div class="dialog-body"></div>
  </dialog>
  <dialog id="call-dialog" aria-label="Sign with Ting ID">
    <button class="close" aria-label="Close">×</button>
    <div class="dialog-body"></div>
  </dialog>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="notice">Ting Canvas needs JavaScript: it reads the chain and makes call links for your wallet.</p></noscript>
</body>
</html>
